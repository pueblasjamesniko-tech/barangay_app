name: barangay_app
description: MaguikayConnect - Barangay community reporting mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  intl: '>=0.19.0 <1.0.0'
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Optional: put the barangay seal at assets/logo.png, then uncomment these 2 lines.
  # (Without the file the app shows a gold shield icon instead, so nothing breaks.)
  # assets:
  #   - assets/logo.png
